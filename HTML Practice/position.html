<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #d1{
            background-color: aqua;
            height: 100vh; /*"vh" is used to creat full scree size */


        }
        #d2{
            background-color: blue;
           position: sticky;
           /* when we reach to the specific section the it stick to the top  */
           top: 9px;
           height: 50px;

        }
        #d3{
            background-color: magenta;
            position: fixed;
            /* it fixed the spicifc to the top from starting */
            top: 10px;
            height: 55px;

            
        }
        #d4{
            background-color: red;
            height: 100vh;
        }
    </style>

</head>

<body>
    <div id="d1">Div1</div>
    <div id="d2">Div2</div>
    <div id="d3">Div3</div>
    <div id="d4">Div4</div>
</body>
</html>
