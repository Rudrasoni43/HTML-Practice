<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #parent{
            position: relative;
            width: 800px;
            height: 500px;
            background-color: pink;
            border: 3px solid brown;

        }
        #d1{
            /* transform: translate(150px); */
            animation: move 6s  infinite alternate;
        }
        @keyframes move{
            from{
                transform: translateY(0px);
            }
            to{
                transform: translateX(150px);
            }
        }
        

        #d1{
            position: relative;
            /* use to shift the box nessery to write this  */
            width: 200px;
            height: 150px;
            background-color: aqua;
            border: 2px solid red;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 10px 10px 10px 5px blue;
            /* sequence for box shadow is horizontal, vertical,blur,spred,color */
            left: 50px;
            top: 30px;
             z-index: 3; /*this helps yo specify which will overlap whom */
            
        }
        #d2{
            position: absolute;
            /* "relative" will shift it the box from orignal position
            and "absolute" will shift with refrence the screen /parent */
            width: 200px;
            height: 150px;
            background-color: blue;
            border: 2px solid red;
            box-shadow: 10px 10px 10px 5px aqua;
            padding: 20px;
            box-sizing: border-box;
            bottom: 50px;
            right: 90px;
            z-index: 2;

        }
        #d2:hover{
            transform: rotate(40deg);
        }
        #d3{
            position: absolute;
            width: 200px;
            height: 150px;
            background-color: green;
            border: 2px solid red;
            box-shadow: 10px 10px 10px 5px aqua;
            padding: 20px;
            box-sizing: border-box;
            bottom: 50px;
            left: 90px;
            z-index: 2;
        }
        #d3:hover{
            transform: skew(40deg);       
        }

    </style>
</head>
<body>
    <div id="parent">

        <div id="d1">This is div section</div>
        <div id="d2">This is second </div>
        <div id="d3">This is third </div>
       

    </div>
</body>
</html>
