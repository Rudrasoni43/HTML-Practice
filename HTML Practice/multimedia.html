<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h3> Images Insertion</h3>

         <img src="/images/flower.jpg" alt="flower" width="300" height="200">
         <!-- here src is used to specify the path of the image, alt is used to specify the alternative text for the image if image is not visible, width and height are used to specify the size of the image. -->
         <hr>
         
         <h3>Audio tag</h3>
            <audio controls muted autoplay loop width="300" height="200">
                <source src="/Audio/ringtone 2.mp3" type="audio/mp3">
            </audio>

          
          <h3>Video tag</h3>
            <video controls muted autoplay loop width="600" height="300">
                <source src="/Video/VID-20260817-WA0058.mp4" type="video/mp4">
          <br>
          <h3>Iframes</h3>
          <iframe src="" frameborder="0" width="600" height="300"></iframe>
          <!-- here src is used to specify the path of the file, frameborder is used to specify the border of the iframe, width and height are used to specify the size of the iframe. -->

          


</body>
</html>
