<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3> SVG Graphics</h3>
    <svg width="600" height="300">
        <rect height="100" width="150" fill="red" x="50" y="50"></rect>
      
      <!-- here svg is used to create a rectangle shape, width and height are used to specify the size of the rectangle, style is used to specify the color and border of the rectangle. -->
    
        <circle cx="300" cy="50" r="50" fill="blue"></circle>
    
        <ellipse cx="300" cy="150" rx="80" ry="30" fill="pink" stroke="black" stroke-width="5"></ellipse>

        <line x1="10" y1="200" x2="150" y2="200" stroke="green" stroke-width="5"></line>
        </svg>
    <svg>
        <polygon points="30 50 60 80 46 100" fill="yellow" stroke="black" stroke-width="5"></polygon>
        <text x="20" y="30" fill="black" font-size="20">Shape</text>
    </svg>
</body>
</html>
